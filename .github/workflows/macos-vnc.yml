name: macOS Native VNC

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "运行分钟数（最大 350）"
        default: "60"

jobs:
  vnc:
    runs-on: macos-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.duration || '60') }}
    steps:
      - name: Runner 信息
        run: |
          sw_vers
          uname -m

      # 1. 安装 bore 隧道工具
      - name: Install bore
        run: |
          set -e
          case "$(uname -m)" in
            arm64|aarch64) ARCH=aarch64-apple-darwin ;;
            x86_64)        ARCH=x86_64-apple-darwin ;;
            *) echo "未知架构: $(uname -m)"; exit 1 ;;
          esac
          VERSION=$(curl -s https://api.github.com/repos/ekzhang/bore/releases/latest \
                    | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          curl -L -o bore.tar.gz \
            "https://github.com/ekzhang/bore/releases/download/${VERSION}/bore-${VERSION}-${ARCH}.tar.gz"
          tar xzf bore.tar.gz
          chmod +x bore
          xattr -d com.apple.quarantine bore 2>/dev/null || true

      # 2. 下载、配置并启动 VirtualDisplay (修正了下载链接)
      - name: Setup VirtualDisplay
        run: |
          set -e
          VERSION=$(curl -s https://api.github.com/repos/youngyunxing/VirtualDisplay/releases/latest \
                    | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          echo "获取到 VirtualDisplay 版本: $VERSION"
          
          # 使用带版本号的真实文件名格式
          DOWNLOAD_URL="https://github.com/youngyunxing/VirtualDisplay/releases/download/${VERSION}/VirtualDisplay-${VERSION}.zip"
          echo "下载地址: $DOWNLOAD_URL"
          
          curl -L -o VirtualDisplay.zip "$DOWNLOAD_URL"
          
          # 校验文件大小
          FILE_SIZE=$(stat -f%z VirtualDisplay.zip)
          echo "下载的文件大小: $FILE_SIZE 字节"
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ 下载失败，文件太小，可能是不存在的页面"
            exit 1
          fi
          
          unzip -o VirtualDisplay.zip
          
          # 移动到应用程序并移除隔离
          mv VirtualDisplay.app /Applications/
          xattr -dr com.apple.quarantine /Applications/VirtualDisplay.app
          
          # 在后台启动应用
          open /Applications/VirtualDisplay.app
          sleep 3
          
          # 使用内置的 vdctl 创建虚拟显示器
          VDCTL="/Applications/VirtualDisplay.app/Contents/MacOS/vdctl"
          
          echo "--> 正在创建虚拟显示器..."
          $VDCTL add display MacVNC || true
          
          echo "--> 正在添加 4K 预设..."
          $VDCTL add preset MacVNC "4K" 3840 2160 60 || true
          
          echo "--> 正在激活 4K 预设..."
          $VDCTL activate preset MacVNC "4K" || true
          
          echo "当前虚拟显示器状态:"
          $VDCTL status || true

      # 3. 使用 kickstart 开启原生 VNC 并设置密码
      - name: Enable Native VNC (kickstart)
        env:
          # ⚠️ 警告: macOS 原生 VNC 密码最长只支持 8 位
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          # 截取前8位，防止密码过长导致无法验证
          VNC_PWD_SHORT=$(echo "$VNC_PASSWORD" | cut -c1-8)
          
          echo "正在配置 macOS 原生屏幕共享..."
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all -allowAccessFor -allUsers \
            -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PWD_SHORT"
          
          echo "原生 VNC 已成功启动！监听在 5900 端口"

      # 4. 启动 bore 隧道并输出公网地址
      - name: Start bore tunnel
        env:
          BORE_SERVER: ${{ secrets.BORE_SERVER }}
          BORE_SECRET: ${{ secrets.BORE_SECRET }}
        run: |
          set -e
          if [ -n "$BORE_SERVER" ]; then
            nohup ./bore local 5900 --to "$BORE_SERVER" --secret "$BORE_SECRET" > bore.log 2>&1 &
          else
            nohup ./bore local 5900 --to bore.pub > bore.log 2>&1 &
          fi

          PORT=""
          for i in $(seq 1 30); do
            PORT=$(grep -oE 'remote_port=[0-9]+' bore.log | head -1 | cut -d= -f2)
            if [ -z "$PORT" ]; then
              PORT=$(grep -oE 'listening at [^ ]*:[0-9]+' bore.log | head -1 | grep -oE '[0-9]+$')
            fi
            [ -n "$PORT" ] && break
            sleep 1
          done

          if [ -z "$PORT" ]; then
            echo "===== bore.log ====="; cat bore.log; exit 1
          fi

          HOST=${BORE_SERVER:-bore.pub}
          echo "======================================================"
          echo " 🎉 VNC 连接成功准备就绪！"
          echo " 地址: ${HOST}:${PORT}"
          echo " 密码: 你的 GitHub Secrets 中配置的 VNC_PASSWORD (取前8位)"
          echo " ⚠️ 建议客户端选 1920x1080 HiDPI 以获得清晰画质"
          echo "======================================================"

      # 5. 保持任务运行
      - name: Keep alive
        run: |
          echo "任务运行中... 请手动取消或等待超时。"
          sleep 21600
